site_name: Arpit Gupta | Technical Writing Portfolio
site_description: Portfolio of technical writing, API documentation, information architecture, docs-as-code, and documentation engineering work.
site_url: https://arpitguptaa.github.io/my-docs-site/
repo_url: https://github.com/ArpitGuptaa/my-docs-site
repo_name: ArpitGuptaa/my-docs-site

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/images/a52fc5d7-e39f-4577-a8e4-bef33bf34025.JPG
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
extra_css:
  - stylesheets/extra.css
  - stylesheets/profile.css
nav:
  - About:
      - Arpit Gupta: index.md
      - Experience: about/experience.md
      - Expertise and Platforms: about/products-platforms.md
      - Education and Certifications: about/certifications.md
      - Awards: about/awards.md
  - Projects:
      - Projects Overview: projects/index.md
      - Documentation Automation:
          - Overview: projects/documentation-automation/index.md
          - Architecture: projects/documentation-automation/architecture.md
          - Workflow: projects/documentation-automation/workflow.md
          - Implementation: projects/documentation-automation/implementation.md
      - AI Agent Documentation:
          - Overview: projects/ai-agent-documentation/index.md
          - Architecture: projects/ai-agent-documentation/architecture.md
          - Developer Guide: projects/ai-agent-documentation/developer-guide.md
          - API and SDK: projects/ai-agent-documentation/api-sdk.md
      - Documentation CI/CD:
          - Overview: projects/documentation-cicd/index.md
          - Architecture: projects/documentation-cicd/architecture.md
          - Workflow: projects/documentation-cicd/workflow.md
      - API Documentation:
          - Overview: projects/api-documentation/index.md
          - API Reference: projects/api-documentation/api-reference.md
          - API Samples: projects/api-documentation/api-samples.md
          - Create a Charge: projects/api-documentation/create-charge.md
          - Capture a Charge: projects/api-documentation/capture-charge.md
          - Tokenization Overview: projects/api-documentation/tokenization-overview.md
          - Error Codes: projects/api-documentation/error-codes.md
          - Tutorials: projects/api-documentation/tutorials.md
      - Local Documentation Preview: projects/local-documentation-preview/index.md
  - Work Samples:
      - Overview: work-sample/index.md
      - AWS Deployment Guide: work-sample/devops-platform-aws-deployment-guide.md
      - Documentation Automation: work-sample/doc-process-automation-using-AI-agent.md
      - Process Improvement: work-sample/process-improvement-and-documentation-automation.md
      - AI and Agent Platforms: work-sample/generative-aI-vs-agentic-aI-vs-agent-platforms.md
      - API Documentation Samples: projects/api-documentation/api-samples.md
      - Create a Charge: projects/api-documentation/create-charge.md
      - Capture a Charge: projects/api-documentation/capture-charge.md
      - Tokenization Overview: projects/api-documentation/tokenization-overview.md
      - Error Codes: projects/api-documentation/error-codes.md
  - Content Strategy:
      - Overview: content-strategy/index.md
      - Technical Writing: content-strategy/technical-writing.md
      - API Documentation: content-strategy/api-documentation.md
      - Documentation Quality: content-strategy/documentation-quality.md
      - Business Analyst Practices: content-strategy/business-analysis.md
  - Contact: contact/index.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
extra:
  generator: false
  analytics:
    provider: google
    property: G-DT8Y1SBZ26
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback.
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback. Please share a suggestion on the Contact page.
  consent:
    title: Cookie consent
    description: >-
      This site uses Google Analytics, with your consent, to measure page visits and
      understand which documentation is useful. Feedback ratings help identify pages
      that may need improvement.
    cookies:
      analytics:
        name: Google Analytics
        checked: false
    actions:
      - accept
      - reject
      - manage
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/arpitgupta007/
    - icon: fontawesome/brands/github
      link: https://github.com/ArpitGuptaa
copyright: >-
  Arpit Gupta · Technical Writing Portfolio ·
  <a href="#__consent">Change cookie settings</a>
