site_name: Arpit Gupta | Technical Writing Portfolio
site_description: Portfolio of technical writing, API documentation, information architecture, docs-as-code, and documentation engineering work.
site_url: https://arpitguptaa.github.io/my-docs-site/
repo_url: https://github.com/ArpitGuptaa/my-docs-site
repo_name: ArpitGuptaa/my-docs-site

theme:
  name: material
  language: en
  custom_dir: overrides
  icon:
    logo: material/file-document-outline
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme

extra_css:
  - stylesheets/extra.css

nav:
  - About:
      - Arpit Gupta: index.md
      - Overview: about/overview.md
      - Experience: about/experience.md
      - Expertise and Platforms: about/products-platforms.md
      - Education and Certifications: about/certifications.md
      - Awards: about/awards.md
  - Projects:
      - Projects Overview: projects/index.md
      - Documentation Automation:
          - Overview: projects/documentation-automation/index.md
          - Architecture: projects/documentation-automation/architecture.md
          - Workflow: projects/documentation-automation/workflow.md
          - Implementation: projects/documentation-automation/implementation.md
      - AI Agent Documentation:
          - Overview: projects/ai-agent-documentation/index.md
          - Architecture: projects/ai-agent-documentation/architecture.md
          - Developer Guide: projects/ai-agent-documentation/developer-guide.md
          - API and SDK: projects/ai-agent-documentation/api-sdk.md
      - Documentation CI/CD:
          - Overview: projects/documentation-cicd/index.md
          - Architecture: projects/documentation-cicd/architecture.md
          - Workflow: projects/documentation-cicd/workflow.md
          - Local Preview: projects/documentation-cicd/local-preview.md
      - API Documentation:
          - Overview: projects/api-documentation/index.md
          - API Reference: projects/api-documentation/api-reference.md
          - Tutorials: projects/api-documentation/tutorials.md
      - Local Documentation Preview: projects/local-documentation-preview/index.md
  - Work Samples:
      - Overview: work-sample/index.md
      - AWS Deployment Guide: work-sample/devops-platform-aws-deployment-guide.md
      - Documentation Automation: work-sample/doc-process-automation-using-AI-agent.md
      - Process Improvement: work-sample/process-improvement-and-documentation-automation.md
      - AI and Agent Platforms: work-sample/generative-aI-vs-agentic-aI-vs-agent-platforms.md
      - API - Capture a Charge: clover-project/capture-a-charge-tutorial.md
      - Tokenization Overview: clover-project/ecommerce-tokenization-overview.md
      - Error Codes: clover-project/ecommerce-error-codes.md
      - Shopify Integration: clover-project/integrate-clover-payments-plugin-with-shopify-online-shop.md
      - Compliance Webhooks: clover-project/clover-payments-plugin-shopify-webhooks.md
  - Resources:
      - Overview: resources/index.md
      - Technical Writing: resources/technical-writing.md
      - API Documentation: resources/api-documentation.md
      - Documentation Quality: resources/documentation-quality.md
      - Business Analyst: resources/business-analysis.md
  - Contact: contact/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/arpitgupta007/
    - icon: fontawesome/brands/github
      link: https://github.com/ArpitGuptaa
