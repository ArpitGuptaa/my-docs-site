site_name: Arpit Gupta | Technical Writing Portfolio
site_description: Portfolio of technical writing, API documentation, information architecture, docs-as-code, and documentation engineering work.
site_url: https://arpitguptaa.github.io/my-docs-site/
repo_url: https://github.com/ArpitGuptaa/my-docs-site
repo_name: ArpitGuptaa/my-docs-site

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
extra_css:
  - stylesheets/extra.css
  - stylesheets/profile.css
  - stylesheets/final-overrides.css
  - stylesheets/ask-arpit.css
  - stylesheets/live-ribbon.css
extra_javascript:
  - javascripts/ask-arpit.js
  - javascripts/live-ribbon.js
nav:
  - About me: index.md
  - Expertise: about/products-platforms.md
  - Experience: about/experience.md
  - Work Samples: work-sample/index.md
  - Projects: projects/index.md
  - Content Strategy: content-strategy/index.md
  - Reference: reference/index.md
  - Contact: contact/index.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
extra:
  generator: false
  analytics:
    provider: google
    property: G-DT8Y1SBZ26
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback.
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback. Please share a suggestion on the Contact page.
  consent:
    title: Cookie consent
    description: >-
      This site uses Google Analytics, with your consent, to measure page visits and
      understand which documentation is useful. Feedback ratings help identify pages
      that may need improvement.
    cookies:
      analytics:
        name: Google Analytics
        checked: false
    actions:
      - accept
      - reject
      - manage
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/arpitgupta007/
    - icon: fontawesome/brands/github
      link: https://github.com/ArpitGuptaa
copyright: >-
  Arpit Gupta · Technical Writing Portfolio ·
  <a href="#__consent">Change cookie settings</a>
